<script>
const cv=document.getElementById('c'),gl=cv.getContext('webgl2');
const vs=`#version 300 es
in vec2 a;void main(){gl_Position=vec4(a,0,1);}`;
const fs=`#version 300 es
precision highp float;
uniform vec2 R;uniform float S,T,W,Hh,lvl;uniform vec2 C,sun;uniform float H_[64];uniform vec3 uWc;uniform vec2 uOff,uSq;uniform float uCi,uCw,uDT,uDS,uDI,uDM,uDF,uDW,uTb;

float sdf(vec2 q){float w=W-Hh;return length(vec2(q.x-clamp(q.x,-w,w),q.y))-Hh;}
float hv(float x){float u=clamp((x-(C.x-W))/(2.*W),0.,1.)*63.;int i=int(floor(u));int j=min(i+1,63);return mix(H_[i],H_[j],fract(u));}
vec3 bg(vec2 p){
 vec3 c=mix(vec3(.04,.05,.13),vec3(.17,.09,.27),p.y/R.y);
 c+=vec3(.9,.25,.5)*.45*exp(-length(p-vec2(.2,.35)*R)/(.25*R.x));
 c+=vec3(.1,.5,.9)*.45*exp(-length(p-vec2(.85,.25)*R)/(.22*R.x));

 // espectro projetado: a luz atravessa a água, então segue a superfície
 float k=smoothstep(900.,120.,dl);
 for(int i=0;i<3;i++){float f=float(i);
  vec2 q=p-(C+dn*(170.+f*uDS));
  vec2 pr=vec2(dot(q,dn),dot(q,vec2(-dn.y,dn.x)));

  for(int i=0;i<3;i++){
   vec2 off=-n*rim*kk[i];
   if(wet)off+=vec2(-sl*70.*(1.+.12*float(i)*uCi/.16),9.+float(i)*2.*uCi/.16);

  }

   col=col*mix(min(mix(uWc,vec3(1.),.55)*1.06,vec3(1.1)),uWc,depth)+uWc*.1*depth;
   col=mix(col,vec3(.86,.9,.9)*(.75+.25*smoothstep(0.,1.,depth)),uTb*(1.+.5*depth));
   float ph=pb.x*.085+hv(pb.x)*.35+T*.6;
   vec3 ca=.5+.5*sin(vec3(ph,ph+.7,ph+1.4)*2.);
   col+=uCi*pow(ca,vec3(3.))*mix(1.,clamp(abs(sl)*14.,0.,1.),uCw)*smoothstep(-.1,.4,L.y)*(1.-depth*.5);

   float sp=pow(max(dot(ns,normalize(vec2(sun.x-p.x,sun.y-ys))),0.),10.);
   col+=(.5+1.4*sp)*exp(-sd*sd/3.5)*vec3(.9,.97,1.);

  col+=rr*(pow(fa,4.)*vec3(1.,.9,.75)*.9+pow(fb,5.)*vec3(.5,.7,1.)*.35);
  col+=(pow(fa,9.)*vec3(.9,.2,.1)+pow(max(dot(n,normalize(L+vec2(.25)*n)),0.),9.)*vec3(.1,.3,.9))*rim*.45;

 }

}`;

const META=[['Interação'],['click','chk'],['squish','chk'],['sqa','Força elástica',0,2,.05],['Água'],['wc','col'],['c2','Velocidade das ondas',.04,.3,.01],['damp','Amortecimento',.0005,.12,.0005],['visc','Viscosidade',0,.3,.01],['finger','Força do toque',.04,.4,.01],['lvl','Nível da água',-30,30,1],['tb','Turbidez',0,.7,.01],['ci','Cores dentro da água',0,.5,.01],['cw','Cores só com ondas',0,1,.05],
['Dispersão'],['dt','Espessura das faixas',1,14,.5],['ds','Espaço entre cores',2,60,1],['di','Intensidade',0,8,.1],['dm','Deslocamento máximo',0,80,1],['df','Foco nas ondas',0,3,.1],['dw','Altura da faixa',30,220,5]];
const P={...DEF,lang:['pt','en','es'].includes((navigator.language||'').slice(0,2))?(navigator.language||'').slice(0,2):'pt'},KEY='liquid-in-glass-settings';

 const ins={};
 {const row=document.createElement('label'),name=document.createElement('span'),sel=document.createElement('select');row.className='chk';name.textContent=t('Idioma');
  [['pt','Português'],['en','English'],['es','Español']].forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;sel.appendChild(o)});sel.value=P.lang;

 syncFn=sync;const rb=document.createElement('button'),ub=document.createElement('button');rb.className=ub.className='pbtn';rb.textContent=t('Valores reais da água');ub.textContent=t('Voltar aos valores anteriores');ub.hidden=!snap;

const HINT='Toque na cápsula para mexer a água. Arraste o Sol para mudar a luz.';

const fmt=v=>typeof v==='boolean'?(v?'✓':'✗'):typeof v==='number'?String(+v.toFixed(4)):String(v);

function renderLog(){const list=document.getElementById('loglist');if(!list)return;list.textContent='';const cur=JSON.stringify(snapOf());

  tm.textContent=new Date(e.t).toLocaleTimeString(P.lang);

function buildLog(){const old=document.getElementById('logp');if(old)old.remove();

const RNG={sunx:[0,1],suny:[0,1]};META.forEach(m=>{if(m.length>2)RNG[m[0]]=[m[2],m[3]]});

function applyShare(str){try{str=String(str||'').trim();const m=/(?:^|[#&?])s=([A-Za-z0-9_-]+)/.exec(str),code=m?m[1]:(/^[A-Za-z0-9_-]+$/.test(str)?str:null);if(!code)return false;

  else if(typeof d==='boolean'){if(typeof v==='boolean')c[k]=v}
  else if(typeof d==='string'&&typeof v==='string'&&/^#[0-9a-f]{6}$/i.test(v))c[k]=v}

build(false);applyLang();

const N=64,h=new Float32Array(N),v=new Float32Array(N);

function resize(){dpr=Math.min(devicePixelRatio||1,2);vw=innerWidth;vh=innerHeight;cv.width=vw*dpr;cv.height=vh*dpr;

addEventListener('resize',resize);resize();
const pos=e=>[e.clientX,vh-e.clientY];

 else{const q=[Math.abs(px-C[0])-(W-Hh),py-C[1]];
  if(Math.hypot(Math.max(q[0],0),q[1])<Hh*1.25)mode='finger';else mode=null}

const up=()=>{cv.style.cursor='pointer';if(sunT){clearTimeout(sunT);sunT=null;save()}if(mode==='finger'&&P.click)return;mode=null};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
function step(){
 const c2=P.c2,damp=P.damp,visc=P.visc;
 for(let i=0;i<N;i++){const l=h[i>0?i-1:0],r=h[i<N-1?i+1:N-1];v[i]+=c2*(l+r-2*h[i])-visc*(v[i]-.5*((i>0?v[i-1]:v[i])+(i<N-1?v[i+1]:v[i])));v[i]*=1-damp}

  const dx=2*W/(N-1),base=C[1]+P.lvl,tgt=tipY-10-base;
  for(let i=0;i<N;i++){const x=C[0]-W+i*dx,g=Math.exp(-((x-fx)**2)/(2*26*26));if(tgt<h[i])v[i]+=(tgt-h[i])*P.finger*g}}

}
const sq={x:1,y:1,ox:0,oy:0,vx:0,vy:0,vox:0,voy:0},tEl=document.getElementById('t');

function frame(){
 const down=mode==='finger',top=C[1]+Hh+70,low=C[1]+P.lvl-Hh*.62;

 gl.uniform2f(uR,vw,vh);gl.uniform1f(uS,dpr);gl.uniform1f(uT,performance.now()/1000);gl.uniform1f(uW,W);gl.uniform1f(uH,Hh);gl.uniform1f(uL,P.lvl);gl.uniform1f(U('uDT'),P.dt);gl.uniform1f(U('uDS'),P.ds);gl.uniform1f(U('uDI'),P.di);gl.uniform1f(U('uDM'),P.dm);gl.uniform1f(U('uDF'),P.df);gl.uniform1f(U('uDW'),P.dw);gl.uniform1f(U('uTb'),P.tb);gl.uniform1f(U('uCi'),P.ci);{const x=parseInt(String(P.wc).slice(1),16)||0;gl.uniform3f(U('uWc'),(x>>16&255)/255,(x>>8&255)/255,(x&255)/255)}gl.uniform1f(U('uCw'),P.cw);
